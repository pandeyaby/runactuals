# Back-test RunActuals on the real Why Next? lesson builder history (read-only).
#
#   runactuals --db replay.db replay examples/why-next-replay.toml
#
# Each case is one scheduled run of the lesson builder (it runs every two hours,
# usually starting around :50 past an odd hour PT). "claimed" is what the
# scheduler's automation status said. It is not what happened. "expect_head" is
# the pushed head the builder's own end-of-run report later named as the green
# tip. That's independent ground truth for the evidence adapter.
#
# Sources: "journal" is the bot's run journal (memory) for the next run, which
# re-checked the previous one. "brief" is the Nov 17 replay request. Start times
# marked "inferred" come from the :50 cadence and the run's first commit; the
# others are the times the reports named.

agent = "lesson-builder"
# Assumed time from start until the scheduler reported a status. Plus grace, the
# evidence window is start + 115 min, just before the next run starts.
run_minutes = 25

[evidence]
adapter = "github_commit_ci"
repo = "pandeyaby/why-next"
branch = "visual-draft"
message_regex = "^Pipeline: flagship lesson "
workflows = ["validate"]
grace_minutes = 90
auth = "gh"              # use the GitHub CLI's login; no token in env or config

